# .github/workflows/agent-evals.yml
# L10 689행: "The suite runs non-interactively in CI on a schedule and on any
# change to CLAUDE.md, skills, or hooks, since that configuration steers the
# agent and deserves the regression testing that code gets."
# L10 727행: "the pass-rate threshold is enforced as a merge check."

name: agent evals

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # L10 711행: "npm install -g @anthropic-ai/claude-code" — the runner has no claude
      # binary of its own; evals/run.sh (line 14) checks `command -v claude` and exits 2
      # (UNDECIDABLE) without it, which make evals would then report as a false pass-shaped skip.
      - run: npm install -g @anthropic-ai/claude-code
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make evals
      # L10 727행: "runs are logged so results can be compared over time" — evals/out is
      # gitignored, so the run's result files are kept as a workflow artifact (also on failure).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ github.run_id }}
          path: evals/out
          if-no-files-found: ignore
