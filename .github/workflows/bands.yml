# .github/workflows/bands.yml — L14 1034: "The trigger layer can be a scheduled
# workflow in GitHub or GitLab." Detection is scripts/detect_bands.py (L14 1030,
# deterministic) against one tests/data/bands/ sample; a live metric store
# (L14 1024) is outside this repo. L14 1038: triage is a person's — the tier-3
# draft is uploaded, never committed.
name: bands
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect control-band tier
        run: |
          mkdir -p /tmp/bands-output
          python3 scripts/detect_bands.py --samples tests/data/bands/spike-3sigma.jsonl \
            --config ops/bands.yaml > /tmp/detection.json \
            2> /tmp/bands-output/detection-error.txt
      - name: Install Claude CLI for diagnosis
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          tier="$(python3 -c "import json;print(json.load(open('/tmp/detection.json'))['tier'])")"
          case "$tier" in
            2sigma|3sigma) npm install -g @anthropic-ai/claude-code ;;
            *) echo "tier=$tier: Claude CLI not required" ;;
          esac
      # L14 1032: 2sigma is repository-read-only diagnosis; 3sigma creates a proposal
      # draft for human triage. The runner owns all output writes and never opens a PR.
      - name: Record or diagnose tier
        run: |
          python3 scripts/run_bands.py --input /tmp/detection.json \
            --id 9999-band-breach --out /tmp/bands-output
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bands-detection, path: /tmp/detection.json }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bands-intent-draft, path: /tmp/bands-output, if-no-files-found: ignore }
