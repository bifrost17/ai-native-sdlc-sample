# L13 line 949: "Pipelines run deterministic scripts, and anything that needs judgment waits for a human"
# — this job is the deterministic part: `make test` (unit tests, hook controls, eval harness without a
# key, managed-settings contract). Evals that need ANTHROPIC_API_KEY live in agent-evals.yml.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && make test > out/build.log 2>&1
      - if: always()
        run: cat out/build.log
      # L13 line 961: "start with read-only judgment steps. Use claude -p in a pipeline job to triage a
      # failed build" — the playbook's pipeline step (L13 981-987) verbatim. Read-only: it writes
      # triage.md, kept as an artifact, and nothing else. Without the key the step is skipped, not failed.
      - name: Triage failed build
        if: failure() && env.ANTHROPIC_API_KEY != ''
        run: >
          npm install -g @anthropic-ai/claude-code &&
          claude -p "Read the build log at out/build.log. Identify the most
          likely cause, say whether the failure looks flaky or real, and write a
          three-line summary for the PR thread." >> triage.md
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: triage-${{ github.run_id }}
          path: triage.md
          if-no-files-found: ignore
