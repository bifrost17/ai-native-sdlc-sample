)};groups.forEach(group=>{group.addEventListener("mouseenter",()=>{hovered=group;render()});group.addEventListener("mouseleave",()=>{if(hovered===group)hovered=null;render()});group.addEventListener("focusin",()=>{focused=group;render()});group.addEventListener("focusout",event=>{if(!group.contains(event.relatedTarget)){if(focused===group)focused=null;render()}})});if(overall){overall.addEventListener("mouseenter",()=>{overallHovered=true;render()});overall.addEventListener("mouseleave",()=>{overallHovered=false;render()});overall.addEventListener("focusin",()=>{overallFocused=true;render()});overall.addEventListener("focusout",event=>{if(!overall.contains(event.relatedTarget)){overallFocused=false;render()}})}render()});</script></body></html>
