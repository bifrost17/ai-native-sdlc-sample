# ops/bands.yaml — Stage 6(레슨 13) 밴드 정의.
#
# 이 파일은 버전 관리되는 **설정**이고, 판정은 scripts/detect_bands.py 가 한다.
# 모델은 개입하지 않는다 — 여기 적힌 수치와 규칙만으로 tier 가 결정된다.
#
# scripts/detect_bands.py 는 PyYAML 을 쓰지 않고 이 파일이 쓰는 부분집합만
# 직접 파싱한다. 앵커·별칭·블록 스칼라·흐름 매핑을 쓰면 조용히 넘어가지 않고
# rc=1 로 죽는다 — 의미상 깨진 설정이 통과하는 것보다 멈추는 편이 싸다.

metric: ci_test_failure_rate

# baseline 의 일수와 window 는 반드시 일치해야 한다(검출기가 대조한다).
baseline: rolling_30d
window: 30

# 기준선이 이만큼 쌓이기 전에는 판정하지 않는다 — tier none + reason.
min_samples: 20

# 기준선 평균이 이 값보다 낮으면 판정하지 않는다.
# 실패가 거의 없는 지표는 σ 가 0 에 붙어, 값 하나만 달라도 즉시 3σ 로 튄다.
min_baseline_rate: 0.02

rules: western_electric

# 우리가 실제로 구현한 규칙만 적는다. 여기 없는 이름을 적으면 rc=1 로 죽는다
# — 「설정에는 있는데 아무도 재지 않는 규칙」을 만들지 않기 위해서다.
rules_enabled:
  - rule1_one_point_beyond_3sigma
  - rule2_nine_points_one_side
  - rule3_two_of_three_beyond_2sigma

# tier → 행동. 검출기는 tier 를 stdout JSON 의 필드로만 알린다(rc 로 알리지 않는다).
# runbook: 은 두지 않는다 — 이 레포에는 사전 승인 runbook 이 없고,
# 없는 것을 설정에 적으면 다음 사람이 있는 줄 안다(docs/PHASES.md 이월 항목).
tiers:
  1sigma:
    action: log
  2sigma:
    action: diagnose
    tools: "Read,Grep"
  3sigma:
    action: propose
    routes: [pull_request]
