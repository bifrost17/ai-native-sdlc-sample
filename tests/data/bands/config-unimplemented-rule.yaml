# 미구현 규칙을 요구하는 설정 — detect_bands.py 는 rc=1 로 죽어야 한다.
# rule4_four_of_five_beyond_1sigma 는 Western Electric 규칙이지만 우리는 구현하지 않았다.
metric: ci_test_failure_rate
baseline: rolling_30d
window: 30
min_samples: 20
min_baseline_rate: 0.02
rules: western_electric
rules_enabled:
  - rule1_one_point_beyond_3sigma
  - rule4_four_of_five_beyond_1sigma
tiers:
  1sigma:
    action: log
  2sigma:
    action: diagnose
    tools: "Read,Grep"
  3sigma:
    action: propose
    routes: [pull_request]
