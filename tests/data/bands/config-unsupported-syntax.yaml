# 우리 파서가 지원하지 않는 YAML 문법(앵커·별칭·블록 스칼라).
# 조용히 넘기면 의미상 깨진 설정이 통과한다(honghu 실사고) — rc=1 로 죽어야 한다.
metric: ci_test_failure_rate
baseline: rolling_30d
window: 30
min_samples: 20
min_baseline_rate: 0.02
rules: western_electric
rules_enabled:
  - rule1_one_point_beyond_3sigma
defaults: &defaults
  action: log
tiers:
  1sigma: *defaults
  2sigma:
    action: diagnose
  3sigma:
    action: propose
